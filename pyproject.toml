[project]
name = "edu-analytics-mvp"
version = "0.1.0"
description = "Sistema de análise de desempenho escolar com IA local"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    # UI
    "streamlit==1.35.0",
    # Data
    "pandas>=2.2",
    "pyarrow>=16.0",
    "openpyxl>=3.1",
    # Schemas
    "pydantic>=2.7",
    # LLM
    "litellm>=1.40",
    "tenacity>=8.3",
    "diskcache>=5.6",
    # Logging
    "structlog>=24.1",
    # DB
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.5",
    "ruff>=0.4",
    "mypy>=1.10",
    "pyyaml>=6.0",   # para tests/infrastructure
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S"]
ignore = ["S101"]  # allow assert in tests

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "**/__init__.py"]

[tool.coverage.report]
fail_under = 85

[tool.hatch.build.targets.wheel]
packages = ["src"]
